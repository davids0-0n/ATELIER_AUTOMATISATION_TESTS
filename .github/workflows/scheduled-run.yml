name: Run planifié des tests

# Toutes les 15 minutes (GitHub peut retarder un peu le déclenchement)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher /run sur PythonAnywhere
        run: |
          code=$(curl -s -o reponse.json -w "%{http_code}" --max-time 60 \
            "https://${{ secrets.PA_WEBAPP_DOMAIN }}/run")
          echo "Code HTTP : $code"
          head -c 600 reponse.json; echo
          # 200 = run effectué, 429 = refusé par l'anti-spam (pas une erreur)
          if [[ "$code" != "200" && "$code" != "429" ]]; then exit 1; fi
